services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=*"
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
         condition: service_healthy

    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    env_file:
      - ./.env
      - ./user-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${USER_APPLICATION_PORT:-8081}"

  booking-service:
    build:
      context: .
      dockerfile: ./booking-service/Dockerfile
    env_file:
      - ./.env
      - ./booking-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${BOOKING_APPLICATION_PORT:-8082}"

  notification-service-go:
    build:
      context: .
      dockerfile: ./notification-service-go/Dockerfile
    env_file:
      - ./.env
      - ./notification-service-go/.env
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${NOTIFICATION_PORT:-8083}"

  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    env_file:
      - ./.env
      - ./gateway/.env
    depends_on:
      user-service:
        condition: service_started
      booking-service:
        condition: service_started
      notification-service-go:
        condition: service_started
    ports:
      - "${GATEWAY_PORT:-8080}:${GATEWAY_PORT:-8080}"

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    depends_on:
      gateway:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-3000}:80"

  collector-service:
    build:
      context: .
      dockerfile: ./collector-service/Dockerfile
    env_file:
      - ./.env
      - ./collector-service/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${COLLECTOR_PORT:-8085}:8080"

  assistant-service:
    build:
      context: .
      dockerfile: ./assistant-service/Dockerfile
    env_file:
      - ./.env
      - ./assistant-service/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "${ASSISTANT_PORT:-8084}:8080"

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # Opt-in local embeddings (profile `llm`). Mounts the host models dir;
  # services reach it as http://llama-embed:8088 (override LLAMA_EMBED_URL).
  llama-embed:
    profiles: ["llm"]
    build:
      context: .
      dockerfile: ./llama-embed/Dockerfile
    volumes:
      - ${MODEL_DIR:-~/models}:/models:ro
    environment:
      LLAMA_MODEL_FILE: /models/${EMBED_MODEL_FILE:-bge-m3-q8_0.gguf}
    ports:
      - "${LLAMA_EMBED_PORT:-8088}:8088"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - gateway
      - user-service
      - booking-service
      - notification-service-go

  grafana:
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  qdrant_data: