spring.application.name=${USER_APPLICATION_NAME}
server.address=${USER_APPLICATION_ADDRESS}
server.port=${USER_APPLICATION_PORT}


#LOGGING
logging.level.root=INFO
logging.level.org.flywaydb=INFO
logging.level.org.springframework.boot.autoconfigure.flyway=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation=INFO
logging.level.org.springframework.web.servlet.mvc.method=INFO
logging.level.org.apache.kafka=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.springframework.security=WARN
logging.level.org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration=OFF
logging.level.com.microservices_example_app.users=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [traceId=%X{traceId}, spanId=%X{spanId}] - %msg%n

#PASSWORD HASHING
spring.psw4j.hash.bcrypt.rounds=10
spring.psw4j.hash.bcrypt.minor=b

rate-limit.max-attempts=10
rate-limit.window-seconds=60

#JDBC
spring.datasource.url=${USER_DATASOURCE_URL}
spring.datasource.username=${USER_DATASOURCE_USERNAME}
spring.datasource.password=${USER_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${USER_DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${USER_DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000


#HIBERNATE
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
user-service.authentication.reset-password-url=${RESTORE_PASSWORD_URL}

#FLYWAY
spring.flyway.enabled=true
spring.flyway.url=${USER_MIGRATION_URL:${USER_DATASOURCE_URL}}
spring.flyway.user=${USER_DATASOURCE_USERNAME}
spring.flyway.password=${USER_DATASOURCE_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migration=true
spring.flyway.cleanDisabled=false


#KAFKA
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=user-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.microservices_example_app.users.event
spring.kafka.consumer.properties.spring.json.use.type.headers=false
topic.authentication=notification.authentication
topic.user-lifecycle=notification.user-lifecycle
topic.booking-events=notification.booking-events
topic.mass-mailing=user.mass-mail
topic.notification.mass-mailing=notification.mass-mailing
topic.forget-password=notification.forget-password


#ADMIN USER PROPERTIES
app.root-admin.username= ${ADMIN_USERNAME}
app.root-admin.email= ${ADMIN_MAIL}
app.root-admin.password= ${ADMIN_PASSWORD}

#OBSERVABILITY
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when_authorized
management.prometheus.metrics.export.enabled=true
management.tracing.sampling.probability=1.0

#OPENAPI
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.paths-to-exclude=/actuator/**,/fallback/**