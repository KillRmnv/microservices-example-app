name: CI Full (Release)

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ci-full-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

jobs:
  build-and-test:
    name: Build & Test All Services
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:24-dind
        options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build all Docker images
        run: |
          docker build -f user-service/Dockerfile -t user-service:test ..
          docker build -f booking-service/Dockerfile -t booking-service:test ..
          docker build -f notification-service/Dockerfile -t notification-service:test ..
          docker build -f gateway/Dockerfile -t gateway:test ..
          docker build -f notification-service-go/Dockerfile -t notification-service-go:test .
          docker build -f frontend/Dockerfile -t frontend:test ..

  smoke-test:
    name: Smoke Tests (Full Stack)
    needs: build-and-test
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:24-dind
        options: --privileged
    env:
      GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
      GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Start full stack
        run: docker compose up -d --build

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium

      - name: Wait for services healthy
        run: |
          echo "Waiting for gateway..."
          for i in {1..60}; do
            if curl -sf http://localhost:8080/actuator/health >/dev/null; then
              echo "Gateway healthy!"
              sleep 10
              break
            fi
            sleep 5
          done

      - name: Run E2E tests
        run: |
          cd gateway
          ./gradlew test -Djunit.jupiter.tags.include=e2e --no-daemon
        env:
          CHROME_BIN: /usr/bin/chromium
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}

      - name: Cleanup
        if: always()
        run: docker compose down -v