# Same-origin API: the browser calls :3000/users and :3000/booking,
# nginx proxies them to the gateway (Docker DNS name).
upstream gateway {
    server gateway:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /users/ {
        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward client auth headers explicitly (nginx forwards all by default,
        # listed here so future proxy_set_header additions don't silently drop them)
        proxy_set_header Authorization $http_authorization;
    }

    location /booking/ {
        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /catalog/ {
        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /assistant/ {
        proxy_pass http://gateway;
        # Local LLM reasoning can exceed the default 60s read timeout.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Static export: /login -> login.html or login/index.html
    # HTML is never cached: a rebuild changes hashed asset URLs, and an old
    # document would point at chunks that no longer exist.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Immutable build assets: safe to cache for a year.
    location /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-store, must-revalidate" always;
    }
}
