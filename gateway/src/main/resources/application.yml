server:
  port: ${GATEWAY_PORT:8080}
  address: ${GATEWAY_ADDRESS}
spring:
  application:
    name: ${GATEWAY_APPLICATION_NAME:gateway}

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

          routes:
            - id: users-service
              uri: http://user-service:8081
              predicates:
                - Path=/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: userServiceCircuitBreaker
                    fallbackUri: forward:/fallback/users
                - name: Retry
                  args:
                    retries: 2
                    backoff:
                      firstBackoff: 500ms
                      maxBackoff: 1s
              metadata:
                connect-timeout: 3000
                response-timeout: 5s

            - id: booking-service
              uri: http://booking-service:8082
              predicates:
                - Path=/booking/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: bookingServiceCircuitBreaker
                    fallbackUri: forward:/fallback/booking
                - name: Retry
                  args:
                    retries: 2
                    backoff:
                      firstBackoff: 500ms
                      maxBackoff: 1s
              metadata:
                connect-timeout: 3000
                response-timeout: 5s
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:8080"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - Accept
                  - X-User-Name
                  - X-User-Role
                  - X-User-Email
                allowCredentials: true
                maxAge: 3600
jwt:
  secret: ${JWT_SECRET:your-super-secret-key-at-least-32-characters-long!}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
resilience4j:
  circuitbreaker:
    instances:
      userServiceCircuitBreaker:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      bookingServiceCircuitBreaker:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      userServiceCircuitBreaker:
        timeout-duration: 5s
      bookingServiceCircuitBreaker:
        timeout-duration: 5s
logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: DEBUG
    com.microservices_example_app.gateway: DEBUG
    org.springframework.http.server.reactive: INFO
    org.springframework.web.server: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [traceId=%X{traceId}, spanId=%X{spanId}] - %msg%n"
