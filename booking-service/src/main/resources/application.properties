spring.application.name=${BOOKING_APPLICATION_NAME}
server.address=${BOOKING_APPLICATION_ADDRESS}
server.port=${BOOKING_APPLICATION_PORT}
spring.data.redis.host=${BOOKING_DATA_REDIS_HOST}
spring.data.redis.port=${BOOKING_DATA_REDIS_PORT}
spring.data.redis.timeout=2000
spring.data.redis.database=0
spring.cache.type=redis
spring.cache.redis.cache-null-values=false
spring.cache.redis.time-to-live=180000

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migration=true
spring.flyway.cleanDisabled=false
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

spring.datasource.url=${BOOKING_DATASOURCE_URL}
spring.datasource.username=${BOOKING_DATASOURCE_USERNAME}
spring.datasource.password=${BOOKING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true



topic.ticket-refund=notification.refund
topic.booking=notification.booking
topic.user.mass-mail=user.mass-mail
topic.booking.catalog=${BOOKING_CATALOG_TOPIC:booking.catalog}
booking.catalog.publish-on-startup=${BOOKING_CATALOG_PUBLISH_ON_STARTUP:true}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

#OBSERVABILITY
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when_authorized
management.prometheus.metrics.export.enabled=true
management.tracing.sampling.probability=1.0
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [traceId=%X{traceId}, spanId=%X{spanId}] - %msg%n

#OPENAPI
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.paths-to-exclude=/actuator/**,/fallback/**